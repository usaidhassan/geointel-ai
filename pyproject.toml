[project]
name = "geointel-ai"
version = "0.1.0"
description = "GeoIntel AI - RAG + lightweight agent over remote sensing / precision agriculture research papers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "requests>=2.32",
    "pymupdf>=1.24",
    "tqdm>=4.66",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "streamlit>=1.38",
    "minsearch>=0.0.4",
    "pandas>=2.2",
    "plotly>=5.23",
]

[tool.uv]
package = false
dev-dependencies = ["pytest>=8.0"]
